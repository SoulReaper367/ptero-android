name: Build PteroManager APK

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptero-manager-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─── Release (runs only on version tags) ────────────────────────────────────
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Optional: sign the release APK ───────────────────────────────────────
      # To enable signing, add these secrets to your GitHub repo:
      #   KEYSTORE_BASE64  – base64-encoded .jks file
      #   KEY_ALIAS        – alias of the signing key
      #   KEYSTORE_PASS    – keystore password
      #   KEY_PASS         – key password
      - name: Decode keystore (if secret exists)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH:  ${{ github.workspace }}/app/release.jks
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASS:  ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS:       ${{ secrets.KEY_PASS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/PteroManager-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PteroManager ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/PteroManager-${{ steps.version.outputs.VERSION }}.apk
          body: |
            ## PteroManager ${{ steps.version.outputs.VERSION }}

            ### NookTheme Android client for Pterodactyl panels

            **Installation**
            1. Download the APK below
            2. Enable "Install from unknown sources" in Android settings
            3. Install and open PteroManager
            4. Add your first panel via **+** → paste your panel URL and `ptlc_` API key
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
